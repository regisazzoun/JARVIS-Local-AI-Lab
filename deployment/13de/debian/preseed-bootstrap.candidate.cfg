# CANDIDATE: qualify partman RAID/ESP behavior on disposable media before release.
# Embed guard, approved.tsv and bootstrap scripts in initrd. No erase approval supplied.
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string jarvis-dell
d-i netcfg/get_domain string local
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string trixie
d-i passwd/root-login boolean false
d-i passwd/username string jarvis-bootstrap
d-i passwd/user-fullname string JARVIS Temporary Bootstrap
d-i passwd/user-password-crypted password @PASSWORD_HASH@
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true
d-i partman/early_command string /bin/sh /guard-physical.sh || { logger -t 13de STOP-identity; while :; do sleep 3600; done; }
d-i partman-auto/disk string @DISK_A@ @DISK_B@
d-i partman-auto/method string raid
d-i partman-partitioning/default_label string gpt
d-i partman-auto/choose_recipe select jarvis-mirror
d-i partman-auto/expert_recipe string jarvis-mirror :: 1024 1024 1024 free $iflabel{ gpt } method{ efi } format{ } . 10000 10000 -1 raid $primary{ } method{ raid } .
d-i partman-auto-raid/recipe string 1 2 0 ext4 / @DISK_A@p2#@DISK_B@p2 .
# No confirmation flags. Human partition review remains mandatory in this candidate.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server sudo python3 ca-certificates mdadm nvme-cli smartmontools efibootmgr rsync wget pciutils dmidecode grub-efi-amd64-signed shim-signed
d-i grub-installer/only_debian boolean true
d-i preseed/late_command string /bin/sh /install-bootstrap.sh && test -s /approved-reboot || { logger -t jarvis STOP-before-reboot; while :; do sleep 3600; done; }
# finalize-efi.sh verifies root mirror and populates ESP2 before reboot.

# Confirmations and reboot approval are NEVER present in this template.
