# TEMPLATE ONLY. Replace all @...@ after human network approval.
port=0
interface=@INTERFACE@
bind-interfaces
listen-address=@SERVER_IP@
dhcp-range=@NETWORK@,proxy,@NETMASK@
dhcp-host=@DELL_MAC@,set:dell
dhcp-ignore=tag:!dell
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:dell,tag:efi64,tag:!ipxe,snponly.efi,,@SERVER_IP@
dhcp-boot=tag:dell,tag:ipxe,http://@SERVER_IP@:8088/discovery.ipxe
pxe-service=tag:dell,tag:efi64,tag:!ipxe,X86-64_EFI,"JARVIS discovery",snponly.efi,@SERVER_IP@
enable-tftp
tftp-root=@TFTP_ROOT@
tftp-secure
log-dhcp
# No dhcp-authoritative, DNS, address pool, router option, RA or DHCPv6.
