---
- name: Dell Debian and AI server
  hosts: dell
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate installed target before configuration
      ansible.builtin.assert:
        that:
          - ansible_facts.system_vendor == 'Dell Inc.'
          - ansible_facts.product_name == 'Precision 5820 Tower X-Series'
          - ansible_facts.product_uuid | lower == approved_uuid | lower
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
  tasks:
    - name: Base and NVIDIA CUDA dependencies
      ansible.builtin.apt:
        name: [iproute2, e2fsprogs, ca-certificates, python3, sudo, openssh-server, mdadm, nvme-cli, smartmontools, rsync, curl, pciutils, linux-headers-amd64, nvidia-driver, nvidia-cuda-toolkit]
        state: present
    - name: Network configuration directory readable by networkd
      ansible.builtin.file:
        path: /etc/systemd/network
        state: directory
        mode: '0755'
    - name: Wired DHCP configuration readable by networkd
      ansible.builtin.copy:
        dest: /etc/systemd/network/20-wired.network
        mode: '0644'
        content: |
          [Match]
          Type=ether
          [Network]
          DHCP=yes
      notify: Restart networkd
    - name: Keep SSH enabled
      ansible.builtin.systemd_service:
        name: ssh
        enabled: true
        state: started
    - name: Ensure Ollama service account
      ansible.builtin.user:
        name: ollama
        system: true
        create_home: true
        home: /var/lib/ollama
        shell: /usr/sbin/nologin
        groups: video,render
        append: true
    - name: Ollama directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: ollama
        group: ollama
        mode: '0755'
      loop: [/opt/ollama, /var/lib/ollama/models]
    - name: Explicit password and key policy retained
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-jarvis.conf
        mode: '0644'
        content: |
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          AllowUsers adminjarvis jarvis-bootstrap
      notify: Reload SSH
    - name: French console keyboard
      ansible.builtin.copy:
        dest: /etc/default/keyboard
        mode: '0644'
        content: |
          XKBMODEL="pc105"
          XKBLAYOUT="fr"
          XKBVARIANT=""
          XKBOPTIONS=""
          BACKSPACE="guess"
          KEYMAP=fr
      notify: Apply French console
    - name: Mdadm alert command
      ansible.builtin.copy:
        dest: /usr/local/sbin/jarvis-md-alert
        mode: '0755'
        content: |
          #!/bin/sh
          logger -t jarvis-mdadm -- "$*"
    - name: Enable local RAID event monitoring
      ansible.builtin.lineinfile:
        path: /etc/mdadm/mdadm.conf
        regexp: '^PROGRAM '
        line: PROGRAM /usr/local/sbin/jarvis-md-alert
      notify: Restart mdmonitor
    - name: Mdadm monitor active
      ansible.builtin.systemd_service:
        name: mdmonitor
        state: started
  handlers:
    - name: Apply French console
      ansible.builtin.command: setupcon --force --keyboard-only
      changed_when: true
    - name: Restart mdmonitor
      ansible.builtin.systemd_service:
        name: mdmonitor
        state: restarted
    - name: Restart networkd
      ansible.builtin.systemd_service:
        name: systemd-networkd
        state: restarted
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
