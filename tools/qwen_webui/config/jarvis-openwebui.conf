<VirtualHost 127.0.0.1:8088>
    ServerName jarvis-macmini.tail805e83.ts.net
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 600
    # Only loopback clients can reach this listener. Preserve Serve's HTTPS indication.
    RequestHeader set X-Forwarded-Proto "https" "expr=req('X-Forwarded-Proto') == 'https'"
    ProxyPass / http://192.168.1.99:3000/ upgrade=websocket timeout=600
    ProxyPassReverse / http://192.168.1.99:3000/
    Header always set X-Content-Type-Options nosniff
    ErrorLog ${APACHE_LOG_DIR}/jarvis-openwebui-error.log
    CustomLog ${APACHE_LOG_DIR}/jarvis-openwebui-access.log combined
</VirtualHost>
